name: surge

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  surge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python surge.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/surge.json
          git diff --staged --quiet || git commit -m "surge: $(date -u -d '+9 hours' +'%Y-%m-%d %H:%M') KST"
          git push
